
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №7 — Галерея</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Галерея изображений</h1>

        <section class="gallery" aria-label="Галерея изображений">
            <button
                class="arrow arrow-left"
                id="prevButton"
                type="button"
                aria-label="Предыдущая страница"
            >
                &#10094;
            </button>

            <div class="gallery-window">
                <div class="gallery-track" id="galleryTrack">
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/gallery1/800/600" alt="Изображение 1">
                    </div>
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/gallery2/800/600" alt="Изображение 2">
                    </div>
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/gallery3/800/600" alt="Изображение 3">
                    </div>
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/gallery4/800/600" alt="Изображение 4">
                    </div>
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/gallery5/800/600" alt="Изображение 5">
                    </div>
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/gallery6/800/600" alt="Изображение 6">
                    </div>
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/gallery7/800/600" alt="Изображение 7">
                    </div>
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/gallery8/800/600" alt="Изображение 8">
                    </div>
                </div>
            </div>

            <button
                class="arrow arrow-right"
                id="nextButton"
                type="button"
                aria-label="Следующая страница"
            >
                &#10095;
            </button>
        </section>

        <div class="pager">
            <div class="page-buttons" id="pageButtons"></div>
            <p id="pageInfo" aria-live="polite">Страница 1 из 3</p>
        </div>
    </main>

    <script>
        const galleryTrack = document.getElementById('galleryTrack');
        const galleryItems = document.querySelectorAll('.gallery-item');
        const prevButton = document.getElementById('prevButton');
        const nextButton = document.getElementById('nextButton');
        const pageButtons = document.getElementById('pageButtons');
        const pageInfo = document.getElementById('pageInfo');

        let currentPage = 0;
        let itemsPerPage = 3;

        function getItemsPerPage() {
            if (window.innerWidth <= 600) {
                return 1;
            }

            return 3;
        }

        function getPageCount() {
            return Math.ceil(galleryItems.length / itemsPerPage);
        }

        function updateGallery() {
            const pageCount = getPageCount();
            const itemWidth = galleryItems[0].offsetWidth;
            const trackStyle = window.getComputedStyle(galleryTrack);
            const gap = parseFloat(trackStyle.columnGap) || 0;
            const offset = currentPage * itemsPerPage * (itemWidth + gap);

            galleryTrack.style.transform = 'translateX(-' + offset + 'px)';

            pageInfo.textContent =
                'Страница ' + (currentPage + 1) + ' из ' + pageCount;

            prevButton.disabled = currentPage === 0;
            nextButton.disabled = currentPage === pageCount - 1;

            pageButtons.replaceChildren();

            for (let i = 0; i < pageCount; i++) {
                const button = document.createElement('button');

                button.type = 'button';
                button.className = 'page-button';
                button.textContent = String(i + 1);
                button.setAttribute('aria-label', 'Страница ' + (i + 1));

                if (i === currentPage) {
                    button.classList.add('active');
                    button.setAttribute('aria-current', 'page');
                }

                button.addEventListener('click', function () {
                    currentPage = i;
                    updateGallery();
                });

                pageButtons.appendChild(button);
            }
        }

        function changePage(direction) {
            const pageCount = getPageCount();

            currentPage += direction;

            if (currentPage < 0) {
                currentPage = 0;
            }

            if (currentPage >= pageCount) {
                currentPage = pageCount - 1;
            }

            updateGallery();
        }

        prevButton.addEventListener('click', function () {
            changePage(-1);
        });

        nextButton.addEventListener('click', function () {
            changePage(1);
        });

        window.addEventListener('resize', function () {
            const newItemsPerPage = getItemsPerPage();

            if (newItemsPerPage !== itemsPerPage) {
                itemsPerPage = newItemsPerPage;
                currentPage = 0;
            }

            updateGallery();
        });

        itemsPerPage = getItemsPerPage();
        updateGallery();
    </script>
</body>
</html>
